palettes:
  - name: sprite_palette
    fixed-entries:
      - color: {index: 0, r: 255, g: 0, b: 255} # Transparent
      - color: {index: 1, r: 255, g: 255, b: 255} # White
      - color: {index: 2, r: 0,   g: 0,   b: 0}   # Black
    images: automatic

converts:
  - name: all_game_assets
    palette: sprite_palette
    transparent-color-index: 0
    images:

      - "slot_machine_bg.png"
      - "background_tile.png"
      - "sym_sixseven.png"
      - "sym_nugget.png"
      - "sym_tung.png"
      - "sym_skibidi.png"
      - "sym_pork.png"
      - "sym_taper.png"

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - sprite_palette
    converts:
      - all_game_assets